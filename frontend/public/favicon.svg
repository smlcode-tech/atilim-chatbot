<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Daireyi kırpma maskesi -->
    <clipPath id="cc">
      <circle cx="23" cy="31" r="13"/>
    </clipPath>
  </defs>

  <!-- Lacivert arka plan -->
  <rect width="64" height="64" rx="10" fill="#283480"/>

  <!-- Daire iç dolgusu: sol yarı = lacivert + beyaz yatay şeritler, sağ yarı = kırmızı -->
  <g clip-path="url(#cc)">
    <!-- Sol yarı: lacivert zemin -->
    <rect x="0" y="0" width="23" height="64" fill="#283480"/>
    <!-- Beyaz yatay şeritler (sol yarıda) -->
    <line x1="0" y1="20" x2="23" y2="20" stroke="white" stroke-width="2"/>
    <line x1="0" y1="24" x2="23" y2="24" stroke="white" stroke-width="2"/>
    <line x1="0" y1="28" x2="23" y2="28" stroke="white" stroke-width="2"/>
    <line x1="0" y1="32" x2="23" y2="32" stroke="white" stroke-width="2"/>
    <line x1="0" y1="36" x2="23" y2="36" stroke="white" stroke-width="2"/>
    <line x1="0" y1="40" x2="23" y2="40" stroke="white" stroke-width="2"/>
    <!-- Sağ yarı: kırmızı -->
    <rect x="23" y="0" width="41" height="64" fill="#CC2020"/>
  </g>
  <!-- Daire dış çizgisi -->
  <circle cx="23" cy="31" r="13" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Köşeli "a" çerçevesi (beyaz): üst çubuk, sağ kenar, alt çubuk, orta çubuk -->
  <rect x="28" y="18" width="19" height="2.5" fill="white"/>    <!-- üst yatay -->
  <rect x="44.5" y="18" width="2.5" height="27" fill="white"/>  <!-- sağ dikey -->
  <rect x="28" y="42.5" width="19" height="2.5" fill="white"/>  <!-- alt yatay -->
  <rect x="28" y="29" width="14" height="2.5" fill="white"/>    <!-- orta yatay -->
</svg>
