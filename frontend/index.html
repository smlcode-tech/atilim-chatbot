<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="theme-color"
      content="#f5f7fc"
    />
    <meta
      name="description"
      content="Atılım Üniversitesi hakkında merak ettiklerinizi Akademik Asistan’a sorun."
    />
    <title>Akademik Asistan | Atılım Üniversitesi</title>
    <script>
      // Tema ilk çizimden önce ayarlanır; React'i beklerse koyu temada önce açık zemin görünür.
      // Seçim kuralı hooks/useTheme.ts ile aynıdır.
      (function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0f111a' : '#f5f7fc')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
