# Render Blueprint: API servisinin yayın tanımı (https://render.com/docs/blueprint-spec).
services:
  - type: web
    name: atilim-assistant-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    # Ücretsiz katmanda disk kalıcı değildir; indeks derleme sırasında üretilir ve yayın paketine girer.
    buildCommand: pip install uv && uv sync --frozen --no-dev && .venv/bin/python -m atilim_assistant ingest
    startCommand: API_PORT=$PORT .venv/bin/python -m atilim_assistant serve
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: API_HOST
        value: 0.0.0.0
      - key: VOYAGE_API_KEY
        sync: false
      - key: EMBED_PROVIDER
        value: voyage
      - key: EMBED_MODEL
        value: voyage-multilingual-2
      - key: EMBED_DIMENSIONS
        value: 1024
      # Yanıt üretimi için Groq; embedding için Voyage AI kullanılır.
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      # Atlas'ta Network Access 0.0.0.0/0 olmalı: Render ücretsiz katmanın sabit çıkış IP'si yok.
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Servis yeniden oluşturulursa yeni değer üretilir ve herkes çıkış yapmış olur.
      - key: JWT_SECRET
        generateValue: true
